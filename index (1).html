// Almacenamiento: IndexedDB como principal (sin el limite de ~5 MB de localStorage) y
// localStorage como copia espejo mientras quepa. Al leer gana la copia mas reciente.
(function() {
  var DB = "grano_db", ST = "kv", dbp = null;
  function open() {
    if (!dbp) dbp = new Promise(function(res, rej) {
      try {
        var rq = indexedDB.open(DB, 1);
        rq.onupgradeneeded = function() { rq.result.createObjectStore(ST); };
        rq.onsuccess = function() { res(rq.result); };
        rq.onerror = function() { rej(rq.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function idb(mode, fn) {
    return open().then(function(db) {
      return new Promise(function(res, rej) {
        var tx = db.transaction(ST, mode), rq = fn(tx.objectStore(ST));
        tx.oncomplete = function() { res(rq ? rq.result : null); };
        tx.onerror = tx.onabort = function() { rej(tx.error); };
      });
    });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  // La copia espejo en localStorage es sincrona y lenta con muchos datos: si pesa, se escribe
  // con retraso (y siempre al ocultar o cerrar la pagina) para no frenar el cobro de cada ticket.
  var pend = {}, timer = null;
  function mirror(key, value, ts) {
    try { localStorage.setItem(key, value); localStorage.setItem(key + "__ts", String(ts)); return true; }
    catch (e) { try { localStorage.removeItem(key); localStorage.removeItem(key + "__ts"); } catch (e2) {} return false; }
  }
  function flush() { if (timer) { clearTimeout(timer); timer = null; } var p = pend; pend = {}; Object.keys(p).forEach(function(k) { mirror(k, p[k].v, p[k].ts); }); }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", function() { if (document.visibilityState === "hidden") flush(); });
  window.storage = {
    backend: "idb+ls",
    flush: flush,
    get: async function(key) {
      var rec = null;
      try { rec = await idb("readonly", function(s) { return s.get(key); }); } catch (e) {}
      flush();
      var ls = lsGet(key), lsTs = parseInt(lsGet(key + "__ts") || "0", 10) || 0;
      var v = rec && rec.v != null && (ls == null || rec.ts >= lsTs) ? rec.v : ls;
      if (v == null) throw new Error("Key not found: " + key);
      return { key: key, value: v, shared: false };
    },
    set: async function(key, value) {
      var ts = Date.now(), ok = false;
      try { await idb("readwrite", function(s) { return s.put({ v: value, ts: ts }, key); }); ok = true; } catch (e) {}
      if (ok && value.length > 400000) { pend[key] = { v: value, ts: ts }; if (!timer) timer = setTimeout(flush, 4000); }
      else if (mirror(key, value, ts)) ok = true;
      if (!ok) throw new Error("No se pudo guardar: almacenamiento lleno o bloqueado");
      return { key: key, value: value, shared: false };
    },
    delete: async function(key) {
      try { await idb("readwrite", function(s) { return s.delete(key); }); } catch (e) {}
      try { localStorage.removeItem(key); localStorage.removeItem(key + "__ts"); } catch (e) {}
      return { key: key, deleted: true, shared: false };
    },
    list: async function(prefix) {
      var keys = [];
      try { keys = (await idb("readonly", function(s) { return s.getAllKeys(); })) || []; } catch (e) {}
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (keys.indexOf(k) < 0 && !/__ts$/.test(k)) keys.push(k); }
      if (prefix) keys = keys.filter(function(k) { return String(k).indexOf(prefix) === 0; });
      return { keys: keys, prefix: prefix || null, shared: false };
    }
  };
  // Pide al navegador que no borre los datos por falta de uso o de espacio
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
